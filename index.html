.pr{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--line)}
.pr.next{background:var(--deep);color:#fff;border:0;box-shadow:0 10px 24px rgba(31,42,68,.18)}
.pr b{font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--bad);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.in{color:var(--ok);font-weight:700}.out{color:var(--bad);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button span{display:grid;place-items:center;margin-bottom:2px}
nav button.on{color:var(--p);background:var(--soft)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
#toast div{background:var(--deep);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(11,42,91,.35);border-left:5px solid var(--p2)}
@media(min-width:800px){body{padding-bottom:24px;padding-top:70px}nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:8px}nav button{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;max-width:150px}nav button span{display:inline-grid;margin:0}}
@media(max-width:480px){.hero .big{font-size:38px}}

const SB={url:'https://ojvbqmdntjatvxpuvxkq.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qdmJxbWRudGphdHZ4cHV2eGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MzA1NjYsImV4cCI6MjEwOTQwNjU2Nn0.YwrWCiUNyJ4ruKOc6Bi7KhSG2VIxxZyRiiEpNPSbknc'};

 id uuid primary key default gen_random_uuid(),

alter table public.households enable row level security;

create or replace function public.my_household() returns uuid language sql security definer stable set search_path=public as $$ select household_id from public.members where user_id=auth.uid() $$;
create policy "anggota melihat anggota" on public.members for select to authenticated using (household_id=public.my_household());

create or replace function public.buat_keluarga(p_role text,p_name text) returns uuid language plpgsql security definer set search_path=public as $$
declare h uuid;
begin
 if auth.uid() is null then raise exception 'Belum masuk'; end if;
 if p_role not in ('Suami','Istri') then raise exception 'Peran tidak valid'; end if;
 insert into households default values returning id into h;
 insert into members(user_id,household_id,role,name) values(auth.uid(),h,p_role,p_name);
 return h;
end $$;
create or replace function public.gabung_keluarga(p_code text,p_role text,p_name text) returns uuid language plpgsql security definer set search_path=public as $$
declare h uuid;
begin
 if auth.uid() is null then raise exception 'Belum masuk'; end if;
 if p_role not in ('Suami','Istri') then raise exception 'Peran tidak valid'; end if;
 select id into h from households where code=lower(trim(p_code));
 if h is null then raise exception 'Kode keluarga tidak ditemukan'; end if;
 if exists(select 1 from members where household_id=h and role=p_role) then raise exception 'Peran % sudah dipakai di keluarga ini',p_role; end if;
 insert into members(user_id,household_id,role,name) values(auth.uid(),h,p_role,p_name);
 return h;
end $$;
revoke all on function public.buat_keluarga(text,text),public.gabung_keluarga(text,text,text) from public,anon;
grant execute on function public.buat_keluarga(text,text),public.gabung_keluarga(text,text,text) to authenticated;
alter publication supabase_realtime add table public.households;`;

<button class="lnk" data-act="local">Coba mode lokal tanpa akun</button></div>`}
function setupView(why){document.body.classList.add('authing');
$('#auth').innerHTML=`<div class="aw"><div class="alogo">${LOGO}</div><h1>Satu langkah lagi</h1><p class="asub">Pilih peranmu dan buat atau gabung ke keluarga.</p><div class="card"><form id="fsu"><input class="full" name="name" placeholder="Nama panggilan" maxlength="30" required>${ROLEHOW()}<button class="btn full">Lanjutkan</button></form><p id="amsg" class="amsg" role="alert"></p></div><button class="lnk" data-act="logout">Keluar</button></div>`;if(why)amsg(tr(why))}
async function authSubmit(i,f){const b=document.querySelector('#auth .btn');b.disabled=true;
try{if((i==='fr'||i==='fsu')&&f.how==='join'&&!f.code.trim()){amsg('Isi kode keluarga dari pasanganmu.');return}
if(i==='fl'){const{error}=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.pw});if(error)throw error}
if(i==='fr'){const{data,error}=await sb.auth.signUp({email:f.email.trim(),password:f.pw,options:{emailRedirectTo:location.href.split('#')[0],data:{name:f.name.trim(),role:f.role,join:f.how==='join'?f.code.trim():''}}});if(error)throw error;if(!data.session)amsg('Akun dibuat. Cek email untuk konfirmasi, lalu masuk.',1)}
if(i==='fsu'){const{data:{user}}=await sb.auth.getUser();await joinHH(f.role,f.name.trim(),f.how==='join'?f.code.trim():'');await boot(user)}}
catch(e){amsg(tr(e.message))}finally{b.disabled=false}}
function act(a){if(a==='sql')navigator.clipboard.writeText(SQL).then(()=>toast('SQL disalin','Tempel di Supabase > SQL Editor lalu klik Run.'),()=>toast('Gagal menyalin','Salin SQL dari bagian atas file index.html.'));
if(a==='copy'&&HH)navigator.clipboard.writeText(HH.code).then(()=>toast('Kode disalin','Kirim ke pasanganmu untuk daftar dengan kode ini.'),()=>{});
if(a==='local'){document.body.classList.remove('authing');render()}
if(a==='logout'&&sb)sb.auth.signOut()}
const codeCard=()=>ME&&HH?`<div class="card t-sky" style="margin-top:14px"><h3>Hubungkan pasanganmu</h3><div class="row"><div class="main"><span>Pasangan daftar lewat tab Daftar, pilih "Gabung dengan kode"</span><b style="font-size:20px;letter-spacing:2px">${esc(HH.code)}</b></div><button class="btn" data-act="copy">Salin</button></div></div>`:'';
let view='home',tf='me',sf='all';
const other=r=>r==='Suami'?'Istri':'Suami';
const uid=()=>Date.now()+Math.floor(Math.random()*999);

/* waktu sholat – hitungan astronomi, Semarang, sudut Kemenag (Subuh 20°, Isya 18°) */
function pt(date){const lat=LOK.lat,lng=LOK.lng,tz=LOK.tz,R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R);
const d=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),12)/864e5+2440587.5-2451545;
const g=(357.529+.98560028*d)%360,q=(280.459+.98564736*d)%360,L=q+1.915*sin(g)+.02*sin(2*g),e=23.439-3.6e-7*d;
let ra=Math.atan2(cos(e)*sin(L),cos(L))/R/15;ra=(ra%24+24)%24;
const dec=Math.asin(sin(e)*sin(L))/R;let eq=q/15-ra;if(eq>12)eq-=24;if(eq<-12)eq+=24;
const noon=12+tz-lng/15-eq,T=a=>Math.acos((-sin(a)-sin(lat)*sin(dec))/(cos(lat)*cos(dec)))/R/15;
const asr=-Math.atan(1/(1+Math.tan(Math.abs(lat-dec)*R)))/R,base=new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime(),D=h=>new Date(base+Math.round(h*36e5));
return[['Subuh',D(noon-T(20)-1/60)],['Terbit',D(noon-T(.833))],['Dzuhur',D(noon+2/60)],['Ashar',D(noon+T(asr)+2/60)],['Maghrib',D(noon+T(.833)+2/60)],['Isya',D(noon+T(18)+2/60)]]}
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function nextPrayer(){const n=new Date();let l=pt(n).filter(p=>p[0]!=='Terbit').find(p=>p[1]>n);if(!l){const t=new Date(n.getTime()+864e5);l=pt(t)[0]}return l}
function left(d){let s=Math.max(0,Math.floor((d-new Date())/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}

/* notifikasi */
function toast(t,b){const d=document.createElement('div');d.innerHTML='<b>'+esc(t)+'</b><br>'+esc(b);$('#toast').appendChild(d);setTimeout(()=>d.remove(),9000);
try{if('Notification' in window&&Notification.permission==='granted'){if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',badge:'icon-192.png'}));else new Notification(t,{body:b})}}catch(e){}}
$('#bell').onclick=()=>{try{Notification.requestPermission().then(p=>toast(p==='granted'?'Notifikasi aktif':'Notifikasi belum aktif',p==='granted'?'Pengingat tugas dan waktu sholat akan muncul di perangkat ini.':'Izinkan notifikasi di pengaturan browser untuk menerima pengingat.'))}catch(e){toast('Notifikasi belum tersedia','Browser ini tidak mendukung notifikasi. Pengingat tetap tampil di dalam aplikasi.')}};
const fired=new Set();
const NF=(()=>{try{return JSON.parse(localStorage.getItem('nf'))||[]}catch(e){return[]}})();
function tick(){if(document.body.classList.contains('authing'))return;const n=new Date();
S.tasks.forEach(t=>{if(!t.done&&!NF.includes(t.id)&&t.due&&new Date(t.due)<=n){NF.push(t.id);try{localStorage.setItem('nf',JSON.stringify(NF))}catch(e){}if(t.to===S.me)toast('Tugas dari '+t.from,t.t+' sudah waktunya dikerjakan.');}});
pt(n).forEach(p=>{const k=p[0]+p[1].toDateString();if(p[0]!=='Terbit'&&!fired.has(k)&&n>=p[1]&&n-p[1]<6e4){fired.add(k);toast('Waktu '+p[0]+' telah tiba',hm(p[1])+' · '+LOK.nama)}});
S.sched.forEach(s=>{if(s.who!==S.me||s.day!==n.getDay())return;const k='s'+s.id+n.toDateString();const[h,m]=s.time.split(':');if(!fired.has(k)&&n.getHours()==h&&n.getMinutes()==m){fired.add(k);toast('Jadwal sekarang',s.t)}});
const c=$('#cd');if(c){const p=nextPrayer();c.textContent=left(p[1])}}
setInterval(tick,1000);

/* tampilan */
const sv=(d,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={home:sv('<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),tasks:sv('<rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>'),sched:sv('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),pray:sv('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>'),money:sv('<path d="M4 7a2 2 0 0 1 2-2h12v4"/><path d="M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2Z"/><circle cx="16.5" cy="14.5" r="1"/>'),x:sv('<path d="M6 6l12 12M18 6 6 18"/>',16),check:sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>',16)};
const NAV=[['home',IC.home,'Beranda'],['tasks',IC.tasks,'Tugas'],['sched',IC.sched,'Jadwal'],['pray',IC.pray,'Sholat'],['money',IC.money,'Keuangan']];
function shell(){$('#nav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'on':''}" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
$('#out').style.display=ME?'':'none';$('#who').innerHTML=ME?`<span class="tag ${ME.role}" style="padding:9px 14px;font-size:13px">${esc(ME.name)} · ${ME.role}</span>`:['Suami','Istri'].map(r=>`<button class="${S.me===r?'on':''}" data-r="${r}">${r}</button>`).join('')}
const taskRow=t=>`<div class="row ${t.done?'done':''}"><button class="chk" data-done="${t.id}" aria-label="Tandai selesai">${t.done?IC.check:''}</button><div class="main"><b>${esc(t.t)}</b><span>Dari ${t.from} untuk ${t.to}${t.due?' · '+new Date(t.due).toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span></div><span class="tag ${t.to}">${t.to}</span><button class="x" data-deltask="${t.id}" aria-label="Hapus">✕</button></div>`;
function mon(){const m=new Date().toISOString().slice(0,7),l=S.tx.filter(x=>x.date.slice(0,7)===m),i=l.filter(x=>x.type==='in').reduce((a,b)=>a+b.amt,0),o=l.filter(x=>x.type==='out').reduce((a,b)=>a+b.amt,0);return{i,o,s:i-o}}
function render(){shell();const A=$('#app'),n=new Date();let h='';
if(view==='home'){const p=nextPrayer(),mine=S.tasks.filter(t=>t.to===S.me&&!t.done),td=S.sched.filter(s=>s.day===n.getDay()&&s.who===S.me),f=mon();
h=`<h2>Halo, ${ME?esc(ME.name):S.me}</h2><div class="card hero"><small>Sholat berikutnya</small><div class="big">${p[0]} ${hm(p[1])}</div><small>Tinggal <b id="cd">${left(p[1])}</b> lagi · ${LOK.nama}</small></div>
<div class="grid"><div class="stat"><b>${mine.length}</b><span>Tugas untukmu</span></div><div class="stat"><b>${td.length}</b><span>Jadwal hari ini</span></div><div class="stat"><b style="font-size:16px;line-height:30px">${rp(f.s)}</b><span>Saldo bulan ini</span></div></div>
${codeCard()}<div class="card t-peach" style="margin-top:14px"><h3>Tugas yang perlu kamu kerjakan</h3>${mine.slice(0,4).map(taskRow).join('')||'<div class="empty">Tidak ada tugas. Santai dulu, atau beri tugas ke pasanganmu.</div>'}</div>
<div class="card t-mint"><h3>Jadwalmu hari ini (${DAYS[n.getDay()]})</h3>${td.sort((a,b)=>a.time.localeCompare(b.time)).map(s=>`<div class="row"><b style="color:var(--p)">${s.time}</b><div class="main"><b>${esc(s.t)}</b></div></div>`).join('')||'<div class="empty">Belum ada jadwal hari ini.</div>'}</div>`}
if(view==='tasks'){const l=S.tasks.filter(t=>tf==='all'||(tf==='me'?t.to===S.me:t.from===S.me)).sort((a,b)=>a.done-b.done||(a.due||'').localeCompare(b.due||''));
h=`<h2>Tugas bersama</h2><div class="card t-lav"><h3>Beri tugas baru</h3><form id="ft"><input class="full" name="t" placeholder="Contoh: Jemput anak sekolah" required><select name="to"><option>${other(S.me)}</option><option>${S.me}</option></select><input type="datetime-local" name="due"><button class="btn full">Kirim tugas</button></form></div>
<div class="chips">${[['me','Untukku'],['by','Dariku'],['all','Semua']].map(c=>`<button data-tf="${c[0]}" class="${tf===c[0]?'on':''}">${c[1]}</button>`).join('')}</div>
<div class="card">${l.map(taskRow).join('')||'<div class="empty">Belum ada tugas di sini.</div>'}</div>`}
if(view==='sched'){const l=S.sched.filter(s=>sf==='all'||s.who===sf);
h=`<h2>Jadwal kegiatan</h2><div class="card t-sky"><h3>Tambah jadwal</h3><form id="fs"><input class="full" name="t" placeholder="Contoh: Rapat kantor" required><select name="who"><option>${S.me}</option><option>${other(S.me)}</option></select><select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${i===n.getDay()?'selected':''}>${d}</option>`).join('')}</select><input type="time" name="time" required value="08:00"><button class="btn full">Simpan jadwal</button></form></div>
<div class="chips">${[['all','Semua'],['Suami','Suami'],['Istri','Istri']].map(c=>`<button data-sf="${c[0]}" class="${sf===c[0]?'on':''}">${c[1]}</button>`).join('')}</div>
${[0,1,2,3,4,5,6].map(i=>(i+n.getDay())%7).map(d=>{const x=l.filter(s=>s.day===d).sort((a,b)=>a.time.localeCompare(b.time));return x.length?`<div class="card ${['t-rose','t-lav','t-mint','t-peach','t-sky','t-rose','t-lav'][d]}"><h3>${DAYS[d]}${d===n.getDay()?' · hari ini':''}</h3>${x.map(s=>`<div class="row"><b style="color:var(--p);width:52px">${s.time}</b><div class="main"><b>${esc(s.t)}</b></div><span class="tag ${s.who}">${s.who}</span><button class="x" data-delsch="${s.id}" aria-label="Hapus">✕</button></div>`).join('')}</div>`:''}).join('')||'<div class="card empty">Belum ada jadwal. Tambahkan jadwal pertama di atas.</div>'}`}
if(view==='pray'){const p=nextPrayer();
h=`<h2>Waktu sholat</h2><div class="card t-lav"><small style="color:var(--muted)">${n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${LOK.nama}, metode Kemenag RI</small></div>${pt(n).map(x=>`<div class="pr ${x[0]===p[0]?'next':''}"><span>${x[0]}${x[0]==='Terbit'?' (batas Subuh)':''}</span><b>${hm(x[1])}</b></div>`).join('')}<p style="color:var(--muted);font-size:13px">Waktu dihitung langsung di perangkat, tanpa internet. Selisih 1 sampai 2 menit dari jadwal resmi masjid setempat bisa terjadi.</p>`}
if(view==='money'){const f=mon(),pc=f.i?Math.max(0,Math.min(100,(f.s/f.i)*100)):0,l=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
h=`<h2>Keuangan keluarga</h2><div class="grid"><div class="stat"><b class="in" style="font-size:15px">${rp(f.i)}</b><span>Pemasukan</span></div><div class="stat"><b class="out" style="font-size:15px">${rp(f.o)}</b><span>Pengeluaran</span></div><div class="stat"><b style="font-size:15px">${rp(f.s)}</b><span>Sisa bulan ini</span></div></div>
<div class="card t-mint" style="margin-top:14px"><h3>Sisa dari pemasukan: ${Math.round(pc)}%</h3><div class="bar"><i style="width:${pc}%"></i></div></div>
<div class="card t-rose"><h3>Catat transaksi</h3><form id="fm"><select name="type"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select><input name="amt" type="number" min="1" inputmode="numeric" placeholder="Jumlah (Rp)" required><input name="cat" placeholder="Kategori (Makan, Gaji…)" required><input name="note" placeholder="Catatan"><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn">Simpan</button></form></div>
<div class="card"><h3>Riwayat</h3>${l.map(x=>`<div class="row"><div class="main"><b>${esc(x.cat)}${x.note?' · '+esc(x.note):''}</b><span>${x.date} · dicatat ${x.who}</span></div><span class="${x.type}">${x.type==='in'?'+':'−'} ${rp(x.amt)}</span><button class="x" data-deltx="${x.id}" aria-label="Hapus">✕</button></div>`).join('')||'<div class="empty">Belum ada transaksi.</div>'}</div>`}
A.innerHTML=h;A.querySelectorAll('.x').forEach(b=>b.innerHTML=IC.x)}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.am){mode=d.am;return authRender()}if(d.act){return act(d.act)}
if(d.v){view=d.v}else if(d.r){S.me=d.r;lsave()}else if(d.tf){tf=d.tf}else if(d.sf){sf=d.sf}
else if(d.done){const k=S.tasks.find(x=>x.id==d.done);k.done=!k.done;save()}
else if(d.deltask){S.tasks=S.tasks.filter(x=>x.id!=d.deltask);save()}
else if(d.delsch){S.sched=S.sched.filter(x=>x.id!=d.delsch);save()}
else if(d.deltx){S.tx=S.tx.filter(x=>x.id!=d.deltx);save()}
else return;render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),i=e.target.id;
if(['fl','fr','fsu'].includes(i)){authSubmit(i,f);return}
if(i==='ft')S.tasks.push({id:uid(),t:f.t,from:S.me,to:f.to,due:f.due,done:false});
if(i==='fs')S.sched.push({id:uid(),t:f.t,who:f.who,day:+f.day,time:f.time});
if(i==='fm')S.tx.push({id:uid(),type:f.type,amt:+f.amt,cat:f.cat,who:S.me,note:f.note,date:f.date});
save();render();if(i==='ft')toast('Tugas terkirim','Tugas untuk '+f.to+' sudah dicatat.')});
/* PWA: manifest.json, ikon, dan sw.js (offline + notifikasi di HP) */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(sbOn()){sb=supabase.createClient(SB.url,SB.key);
sb.auth.onAuthStateChange((ev,ss)=>{if(ev==='SIGNED_OUT'){ME=HH=null;if(CH){sb.removeChannel(CH);CH=null}S={tasks:[],sched:[],tx:[],me:'Suami'};mode='login';authRender()}else if(ev==='SIGNED_IN'&&ss)setTimeout(()=>boot(ss.user),0)});
sb.auth.getSession().then(({data})=>data.session?boot(data.session.user):authRender())}else authRender();
tick();setInterval(pull,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
